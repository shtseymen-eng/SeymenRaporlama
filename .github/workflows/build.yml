name: Build & Release — Windows EXE + macOS APP

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*.*' ]       # v1.0.0 gibi tag gelince release çıkar
  workflow_dispatch:             # elle tetikleme

permissions:
  contents: write

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install customtkinter pandas openpyxl python-pptx pillow xlsxwriter

      - name: EXE derle (PyInstaller spec)
        run: pyinstaller SeymenRaporlama.spec --distpath dist_win --workpath build_win
        shell: cmd

      - name: Verify packaged Windows application safely
        shell: python
        run: |
          import json, pathlib, subprocess
          exe = pathlib.Path('dist_win/SeymenRaporlama.exe')
          assert exe.read_bytes()[:2] == b'MZ'
          subprocess.run([str(exe.resolve()), '--self-test', str(pathlib.Path('smoke.json').resolve())], check=True, timeout=120)
          assert json.loads(pathlib.Path('smoke.json').read_text())['frozen']


      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: SeymenRaporlama-Windows
          path: dist_win/SeymenRaporlama.exe
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  build-macos:
    name: 🍎 macOS APP
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install customtkinter pandas openpyxl python-pptx pillow xlsxwriter

      - name: .app derle (PyInstaller spec)
        run: pyinstaller SeymenRaporlama.spec --distpath dist_mac --workpath build_mac

      - name: Verify packaged macOS application safely
        run: |
          dist_mac/SeymenRaporlama.app/Contents/MacOS/SeymenRaporlama --self-test "$PWD/smoke.json"
          python -c "import json; assert json.load(open('smoke.json'))['frozen']"
          file dist_mac/SeymenRaporlama.app/Contents/MacOS/SeymenRaporlama
          codesign --verify --deep --strict dist_mac/SeymenRaporlama.app

      - name: Package genuine macOS application
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist_mac/SeymenRaporlama.app dist_mac/SeymenRaporlama_mac.zip
          unzip -t dist_mac/SeymenRaporlama_mac.zip

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: SeymenRaporlama-macOS
          path: |
            dist_mac/SeymenRaporlama.dmg
            dist_mac/SeymenRaporlama_mac.zip
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: 📦 GitHub Release oluştur
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # sadece tag push'ta

    steps:
      - name: Windows artifact indir
        uses: actions/download-artifact@v4
        with:
          name: SeymenRaporlama-Windows
          path: release/

      - name: macOS artifact indir
        uses: actions/download-artifact@v4
        with:
          name: SeymenRaporlama-macOS
          path: release/

      - name: Release oluştur ve dosyaları ekle
        uses: softprops/action-gh-release@v2
        with:
          name: "SeymenRaporlama ${{ github.ref_name }}"
          body: |
            ## Seymen Raporlama — ${{ github.ref_name }}

            ### Kurulum (Python gerekmez)

            | Platform | İndir |
            |----------|-------|
            | 🪟 Windows | `SeymenRaporlama.exe` — indirip çift tıkla |
            | 🍎 macOS   | `SeymenRaporlama_mac.zip` — arşivi aç, uygulamayı Applications klasörüne taşı |

            > Windows 10/11 x64 ve macOS 15+ Apple Silicon. Python gerekmez. Paketler geliştirici sertifikasıyla imzalanmamış ve Apple noter onayından geçmemiştir; işletim sistemi ilk açılışta güvenlik onayı isteyebilir.

            Derlenen uygulamalar izole öz-test ile Tk, görsel varlıkları ve Excel okuma/yazma açısından kontrol edilir.
          draft: false
          prerelease: false
          files: release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
